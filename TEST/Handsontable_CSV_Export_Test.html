<!DOCTYPE html>
<html>
    <head>
        <title>Handsontable with CSV Export</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/TEST/CSS/handsontable.min.css" />
        <link rel="stylesheet" href="/TEST/CSS/ht-theme-main.min.css" />
        <script src="/TEST/JavaScript/handsontable.full.min.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', function () {

                const container = document.querySelector('#example1');
                const hot = new Handsontable(container, {
                  data: [
                    ['A1', 'B1', 'C1', 'D1', 'E1', 'F1', 'G1'],
                    ['A2', 'B2', 'C2', 'D2', 'E2', 'F2', 'G2'],
                    ['A3', 'B3', 'C3', 'D3', 'E3', 'F3', 'G3'],
                    ['A4', 'B4', 'C4', 'D4', 'E4', 'F4', 'G4'],
                    ['A5', 'B5', 'C5', 'D5', 'E5', 'F5', 'G5'],
                    ['A6', 'B6', 'C6', 'D6', 'E6', 'F6', 'G6'],
                    ['A7', 'B7', 'C7', 'D7', 'E7', 'F7', 'G7']
                  ],
                  colHeaders: true,
                  rowHeaders: true,
                  hiddenRows: { rows: [1, 3, 5], indicators: true },
                  hiddenColumns: { columns: [1, 3, 5], indicators: true },
                  height: 'auto',
                  autoWrapRow: true,
                  autoWrapCol: true,
                  licenseKey: 'non-commercial-and-evaluation'
                });

                const exportPlugin = hot.getPlugin('exportFile');
                const button = document.querySelector('#export-file');

                button.addEventListener('click', () => {
                  exportPlugin.downloadFile('csv', {
                    bom: false,
                    columnDelimiter: ',',
                    columnHeaders: false,
                    exportHiddenColumns: true,
                    exportHiddenRows: true,
                    fileExtension: 'csv',
                    filename: 'Handsontable-CSV-file_[YYYY]-[MM]-[DD]',
                    mimeType: 'text/csv',
                    rowDelimiter: '\r\n',
                    rowHeaders: true
                  });
              })
            });
        </script>
    </head>
    <body>
        <div class="example-controls-container">
          <div class="controls">
            <button id="export-file">Download CSV</button>
          </div>
        </div>
        <div id="example1" class="ht-theme-main"></div></html>
